name: Deploy and Notify

on:
  push:
    branches:
      - main
  schedule:
    - cron: "*/10 * * * *"   # every 10 minutes (UTC)

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'   # only run on push
    steps:
      # Step 1: Checkout repo
      - name: Checkout
        uses: actions/checkout@v4

      # Step 2: Deploy static files
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public   # static HTML folder

      # Step 3: Notify Telegram (after deploy)
      - name: Notify Telegram
        run: |
          curl -s -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage \
          -d chat_id=${{ secrets.TELEGRAM_CHAT_ID}} \
          -d text="✅ Finance Alert Bot!"

  alert-job:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'   # only run on cron
    steps:
      - name: Finance Alert
        run: |
          curl -s -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage \
          -d chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
          -d text="📊 Finance Alert Bot: Scheduled update at $(date -u)"
