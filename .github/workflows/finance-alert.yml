name: Finance Alerts

on:
  push:
    branches:
      - finance-alert
  schedule:
    - cron: "*/10 * * * *"   # every 10 minutes (UTC)

jobs:
  finance-alert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: pip install yfinance requests

      - name: Run Finance Alert
        run: python finance_alert.py
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
